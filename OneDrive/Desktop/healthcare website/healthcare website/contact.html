<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - HealthCare Plus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        nav {
            background-color: #0077b6;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 { color: white; font-size: 24px; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 16px; }
        nav a:hover { color: #90e0ef; }
        .hero {
            background-color: #caf0f8;
            text-align: center;
            padding: 60px 20px;
        }
        .hero h2 { font-size: 36px; color: #03045e; margin-bottom: 15px; }
        .hero p { font-size: 18px; color: #0077b6; }
        .contact {
            padding: 60px 30px;
            text-align: center;
            background-color: #f8f9fa;
        }
        .contact input, .contact textarea {
            display: block;
            margin: 10px auto;
            padding: 12px;
            width: 400px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        .contact button {
            margin-top: 15px;
            background-color: #0077b6;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        .contact button:hover { background-color: #03045e; }
        .info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .info-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .info-card h3 { color: #0077b6; margin-bottom: 10px; }
        .info-card p { color: #555; font-size: 14px; }
        footer {
            background-color: #03045e;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>🏥 HealthCare Plus</h1>
        <div>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="doctors.html">Doctors</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <div class="hero">
        <h2>Contact Us</h2>
        <p>We are here to help you</p>
    </div>
    <div class="contact">
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <input type="tel" placeholder="Your Phone Number">
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button>Send Message</button>
        <div class="info">
            <div class="info-card">
                <h3>📍 Address</h3>
                <p>123 Health Street, Medical City</p>
            </div>
            <div class="info-card">
                <h3>📞 Phone</h3>
                <p>+91 98765 43210</p>
            </div>
            <div class="info-card">
                <h3>📧 Email</h3>
                <p>info@healthcareplus.com</p>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2026 HealthCare Plus. All rights reserved.</p>
    </footer>
</body>
</html>
